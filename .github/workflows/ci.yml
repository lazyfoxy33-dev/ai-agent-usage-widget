name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-layer:
    name: Data layer (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core tests
        working-directory: core
        run: python3 -m unittest discover
      - name: Touch Bar tests
        working-directory: touchbar
        run: python3 -m unittest discover

  node-frontends:
    name: Design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Design system tests
        run: node --test docs/design/tests/design-system.test.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the committed tree
        run: python3 .github/scripts/secret_scan.py
      - name: Scan the pushed range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            python3 .github/scripts/secret_scan.py --range "$PR_BASE...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python3 .github/scripts/secret_scan.py --range "$PUSH_BEFORE..HEAD"
          else
            echo "secret scan: no pushed range to inspect"
          fi

  macwidget:
    name: macOS widget (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Build and test
        working-directory: macwidget
        run: |
          xcodebuild test \
            -project QuotaWidget.xcodeproj \
            -scheme QuotaWidget \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
