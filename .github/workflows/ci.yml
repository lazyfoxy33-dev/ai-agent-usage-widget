name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-layer:
    name: Data layer (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core tests
        working-directory: core
        run: python3 -m unittest discover
      - name: Touch Bar tests
        working-directory: touchbar
        run: python3 -m unittest discover

  node-frontends:
    name: Design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Design system tests
        run: node --test docs/design/tests/design-system.test.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the committed tree
        run: python3 .github/scripts/secret_scan.py
      - name: Scan the pushed range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            python3 .github/scripts/secret_scan.py --range "$PR_BASE...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python3 .github/scripts/secret_scan.py --range "$PUSH_BEFORE..HEAD"
          else
            echo "secret scan: no pushed range to inspect"
          fi

  macwidget:
    name: macOS widget (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Touch Bar layout tests
        working-directory: touchbar
        run: ./tests/run-layout-tests.sh
      - name: Bundled Touch Bar installer works from inside the app
        run: |
          # QuotaWidget.app copies these scripts to Resources/display-layers/touchbar
          # while core/ lives at Resources/core, so the installer must look there.
          # Run it in a sandbox: temp HOME, stubbed launchctl/pkill.
          SANDBOX="$(mktemp -d)"
          mkdir -p "$SANDBOX/stubs" "$SANDBOX/Resources/display-layers" "$SANDBOX/Resources/core/usage"
          printf '#!/bin/bash\nexit 0\n' > "$SANDBOX/stubs/launchctl"
          printf '#!/bin/bash\nexit 0\n' > "$SANDBOX/stubs/pkill"
          chmod +x "$SANDBOX/stubs/launchctl" "$SANDBOX/stubs/pkill"
          cp -R touchbar "$SANDBOX/Resources/display-layers/touchbar"
          rm -rf "$SANDBOX/Resources/display-layers/touchbar/QuotaBar.app"
          cp core/fetch_usage.py "$SANDBOX/Resources/core/"
          cp core/usage/*.py "$SANDBOX/Resources/core/usage/"
          (
            cd "$SANDBOX/Resources/display-layers/touchbar"
            HOME="$SANDBOX" PATH="$SANDBOX/stubs:$PATH" \
              QUOTABAR_INSTALL_DESTINATION="$SANDBOX/out/QuotaBar.app" bash install.sh
          )
          test -x "$SANDBOX/out/QuotaBar.app/Contents/MacOS/QuotaBar"
          test -f "$SANDBOX/out/QuotaBar.app/Contents/Resources/core/fetch_usage.py"
          test -f "$SANDBOX/Library/LaunchAgents/com.quotabar.app.plist"
      - name: Build and test
        working-directory: macwidget
        run: |
          xcodebuild test \
            -project QuotaWidget.xcodeproj \
            -scheme QuotaWidget \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
